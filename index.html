<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Across Transit</title>
  <meta name="description" content="Live departures, buses on the map, schedules and trip planning.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4a9af0">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- iPhone / iPad home screen -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AcrossTransit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css?v=36">
</head>
<body>
  <div id="offline-banner" class="offline-banner" hidden>You're offline. Departures, buses and the map need a connection.</div>
  <!-- Stops tab -->
  <div id="stops-view" class="view" hidden>
    <header>
      <h1>Across Transit</h1>
      <form id="search-form" autocomplete="off">
        <input id="search-input" type="search" placeholder="Search a stop, e.g. Viru" required>
        <button type="submit">Search</button>
      </form>
    </header>

    <main>
      <section id="stop-list" hidden>
        <ul id="stops"></ul>
      </section>

      <section id="departures-panel" hidden>
        <div class="panel-head">
          <button id="back-btn" type="button" aria-label="Back to stops">←</button>
          <div class="grow">
            <h2 id="stop-name"></h2>
            <p id="stop-meta" class="muted small"></p>
          </div>
          <button id="show-on-map" type="button">Map</button>
        </div>
        <ul id="departures"></ul>
        <p id="updated" class="muted small"></p>
      </section>

      <p id="message" class="muted"></p>
    </main>
  </div>

  <!-- Routes tab -->
  <div id="routes-view" class="view" hidden>
    <header>
      <h1>Routes</h1>
      <input id="routes-search" type="search" placeholder="Line number, name or company" autocomplete="off">
    </header>
    <main>
      <div id="routes-main">
        <div id="routes-list"></div>
      </div>
      <section id="route-detail" hidden>
        <div class="panel-head">
          <button id="route-back" type="button" aria-label="Back to routes">←</button>
          <span id="route-detail-badge"></span>
          <div class="grow">
            <h2 id="route-detail-title"></h2>
            <p id="route-detail-operator" class="muted small"></p>
          </div>
        </div>
        <div id="route-dirs" class="day-btns route-dirs"></div>
        <button id="route-show-map" type="button" class="show-map-btn" hidden>Show on map</button>
        <ul id="route-stops" class="route-stops"></ul>
      </section>
    </main>
  </div>

  <!-- Map tab -->
  <div id="map-view" class="view">
    <div id="map"></div>
    <button id="near-btn" type="button" class="map-btn near-btn" aria-label="Departures near me">🚏</button>
    <button id="centre-btn" type="button" class="map-btn" aria-label="Centre on me">◎</button>
    <div id="route-bar" class="route-bar" hidden>
      <span id="route-bar-badge"></span>
      <span id="route-bar-text" class="grow"></span>
      <button id="route-bar-close" type="button" aria-label="Close route">✕</button>
    </div>
    <div id="map-status" class="map-status">Tap a stop to see its buses</div>

    <!-- Stop panel: opens over the bottom of the map when a stop is chosen -->
    <section id="stop-sheet" class="sheet" hidden>
      <div class="sheet-head">
        <h2 id="sheet-stop-name"></h2>
        <button id="sheet-close" type="button" aria-label="Close stop">✕</button>
      </div>
      <div id="sheet-lines" class="line-chips"></div>
      <p id="sheet-updated" class="stale small sheet-note" hidden></p>
      <ul id="sheet-departures" class="sheet-list"></ul>
    </section>

    <!-- Near me panel: departures from all stops within 200 m -->
    <section id="near-sheet" class="sheet" hidden>
      <div class="sheet-head">
        <h2>Near you</h2>
        <button id="near-close" type="button" aria-label="Close">✕</button>
      </div>
      <div id="near-lines" class="line-chips"></div>
      <p id="near-note" class="muted small sheet-note"></p>
      <ul id="near-departures" class="sheet-list"></ul>
    </section>

    <!-- Plan tab: start/destination box over the top of the map -->
    <div id="plan-box" class="plan-box">
      <div class="plan-fields">
        <div class="plan-field">
          <span class="ab-pin a">A</span>
          <input id="plan-from" type="text" placeholder="Start: search or tap the map" autocomplete="off">
        </div>
        <div class="plan-field">
          <span class="ab-pin b">B</span>
          <input id="plan-to" type="text" placeholder="Destination: search or tap the map" autocomplete="off">
        </div>
      </div>
      <button id="plan-swap" type="button" aria-label="Swap start and destination">⇅</button>
      <div class="plan-time-row">
        <select id="plan-time-mode" aria-label="When">
          <option value="now">Leave now</option>
          <option value="depart">Depart at</option>
          <option value="arrive">Arrive by</option>
        </select>
        <input id="plan-time" type="datetime-local" hidden>
      </div>
      <label class="plan-toggle">
        <input id="plan-city-only" type="checkbox">
        <span>Tallinn city transport only</span>
      </label>
      <label class="plan-source-row">
        <span>Planner</span>
        <select id="plan-source" aria-label="Planner">
          <option value="both">Compare both</option>
          <option value="online">Peatus.ee (online)</option>
          <option value="offline">Own planner (offline)</option>
        </select>
      </label>
      <ul id="plan-suggest" class="suggest" hidden></ul>
    </div>

    <!-- Plan tab: trip options / steps -->
    <section id="plan-sheet" class="sheet" hidden>
      <div class="sheet-head">
        <button id="plan-back" type="button" aria-label="Back to trips" hidden>←</button>
        <h2 id="plan-sheet-title">Trips</h2>
        <button id="plan-collapse" type="button" aria-label="Hide search and steps" hidden>⌄</button>
        <button id="plan-close" type="button" aria-label="Close">✕</button>
      </div>
      <div id="plan-strip" class="plan-strip"></div>
      <ul id="plan-content" class="sheet-list"></ul>
    </section>
  </div>

  <!-- Schedule: one line at the chosen stop, whole day -->
  <section id="schedule-view" class="schedule" hidden>
    <div class="sched-head">
      <button id="sched-back" type="button" aria-label="Back">←</button>
      <span id="sched-badge"></span>
      <div class="grow">
        <h2 id="sched-title"></h2>
        <p id="sched-stop" class="muted small"></p>
      </div>
    </div>
    <div id="sched-days" class="day-btns sched-days"></div>
    <div id="sched-legend" class="sched-legend"></div>
    <div id="sched-body" class="sched-body"></div>
  </section>

  <nav class="tabs">
    <button class="tab-btn" data-tab="stops" type="button">Stops</button>
    <button class="tab-btn" data-tab="routes" type="button">Routes</button>
    <button class="tab-btn active" data-tab="map" type="button">Map</button>
    <button class="tab-btn" data-tab="plan" type="button">Plan</button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/app.js?v=36"></script>
</body>
</html>
